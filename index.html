<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kibaho – Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Kibaho – Elevate your everyday. Thoughtful home, kitchen and bathroom products launching soon." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome (for icons) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- Tailwind config (optional but here if you want to tweak later) -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif'],
          },
        },
      },
    }
  </script>

  <!-- Custom CSS for fade-in animation -->
  <style>
    body {
      background-color: #FDFCF8;
    }
    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-in {
      animation: fade-in 0.8s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row bg-[#FDFCF8] font-sans text-stone-900">

  <!-- Left Side - Visual (Mobile: Top) -->
  <div class="w-full md:w-1/2 h-[40vh] md:h-screen relative overflow-hidden bg-stone-200">
    <div class="absolute inset-0 bg-black/10 z-10"></div>
    <img
      src="https://images.unsplash.com/photo-1600607686527-6fb886090705?auto=format&fit=crop&q=80&w=1600"
      alt="Kibaho Minimalist Aesthetic"
      class="w-full h-full object-cover object-center animate-fade-in scale-105"
    />
    <div class="absolute bottom-8 left-8 z-20 text-white/90 hidden md:block">
      <p class="text-xs font-bold tracking-[0.25em] uppercase mb-2">Kibaho Home</p>
      <p class="text-sm font-light opacity-80">Thoughtful design for everyday living.</p>
    </div>
  </div>

  <!-- Right Side - Content (Mobile: Bottom) -->
  <div class="w-full md:w-1/2 flex flex-col justify-center items-center px-8 py-12 md:p-24 relative">
    <div class="w-full max-w-md space-y-8 text-center md:text-left">

      <!-- Brand Header -->
      <div class="space-y-2">
        <h1 class="text-3xl md:text-4xl font-serif font-bold tracking-[0.2em] text-stone-900">
          KIBAHO
        </h1>
        <div class="h-0.5 w-12 bg-stone-900 mx-auto md:mx-0"></div>
      </div>

      <!-- Main Message -->
      <div class="space-y-4 pt-8">
        <span class="text-xs font-bold tracking-[0.2em] text-stone-500 uppercase block">
          Coming Soon
        </span>
        <h2 class="text-4xl md:text-5xl font-serif leading-tight">
          Elevate your <br />Everyday<span class="text-sm align-top ml-1">TM</span>
        </h2>
        <p class="text-stone-600 text-lg font-light leading-relaxed">
          We are crafting a new online experience to bring ease, elegance, and reliability into your home.
        </p>
      </div>

      <!-- Signup Form -->
      <div class="pt-8">
        <!-- Form state: initially visible -->
        <div id="form-section">
          <form id="notify-form" class="space-y-4">
            <label for="email" class="block text-sm font-medium text-stone-500">
              Be the first to know when we launch.
            </label>
            <div class="flex flex-col sm:flex-row gap-3">
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
                class="flex-1 bg-transparent border-b border-stone-300 py-3 px-2 text-stone-900 placeholder-stone-400 focus:outline-none focus:border-stone-900 transition-colors rounded-none"
              />
              <button
                type="submit"
                class="bg-stone-900 text-white px-8 py-3 text-sm font-bold uppercase tracking-[0.25em] hover:bg-stone-800 transition-colors flex items-center justify-center group"
              >
                Notify Me
                <i class="fa-solid fa-arrow-right ml-2 text-xs group-hover:translate-x-1 transition-transform"></i>
              </button>
            </div>
          </form>
        </div>

        <!-- Success state: initially hidden -->
        <div
          id="success-section"
          class="bg-stone-50 border border-stone-100 p-6 text-center animate-fade-in hidden"
        >
          <div class="w-10 h-10 bg-green-100 text-green-800 rounded-full flex items-center justify-center mx-auto mb-3">
            <i class="fa-solid fa-check text-lg"></i>
          </div>
          <h3 class="font-serif text-lg mb-1">You're on the list!</h3>
          <p class="text-stone-500 text-sm">We'll let you know as soon as we launch.</p>
        </div>
      </div>

      <!-- Footer / Social -->
      <div class="pt-16 flex flex-col md:flex-row items-center md:justify-between gap-6 border-t border-stone-100 mt-12">
        <div class="flex space-x-6">
          <a href="#" class="text-stone-400 hover:text-stone-900 transition-colors" aria-label="Instagram">
            <i class="fa-brands fa-instagram text-lg"></i>
          </a>
          <a href="#" class="text-stone-400 hover:text-stone-900 transition-colors" aria-label="Facebook">
            <i class="fa-brands fa-facebook-f text-lg"></i>
          </a>
          <a href="#" class="text-stone-400 hover:text-stone-900 transition-colors" aria-label="Twitter">
            <i class="fa-brands fa-x-twitter text-lg"></i>
          </a>
        </div>
        <p class="text-xs text-stone-400 tracking-wide">
          &copy; 2025 Kibaho. All rights reserved.
        </p>
      </div>

    </div>
  </div>

  <!-- Simple JS for form submit -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('notify-form');
      const emailInput = document.getElementById('email');
      const formSection = document.getElementById('form-section');
      const successSection = document.getElementById('success-section');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const email = emailInput.value.trim();

        if (!email) return;

        // Here you could send this to a backend / form service (ConvertKit, Mailchimp, etc.)
        // For now we just simulate success:
        setTimeout(function () {
          formSection.classList.add('hidden');
          successSection.classList.remove('hidden');
        }, 500);
      });
    });
  </script>
</body>
</html>
